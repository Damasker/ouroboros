[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ouroboros-plasma-loop"
version = "0.1.0"
description = "Research 0D simulator of a dual-branch closed plasma loop (conceptual, not a reactor proof)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ouroboros Project" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pyyaml>=6.0",
  "pydantic>=2.5",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "hypothesis>=6.92",
  "ruff>=0.1",
  "mypy>=1.7",
]

[project.scripts]
ouroboros = "ouroboros.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ouroboros"]
mypy_path = "src"
ignore_missing_imports = true

# Heavy numerics / viz modules: keep CI green while tightening the rest.
[[tool.mypy.overrides]]
module = [
  "ouroboros.core.oned",
  "ouroboros.viz",
  "ouroboros.viz.*",
]
ignore_errors = true
