name: deploy-pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: make setup
      - name: Cache public demo runs
        id: demo-cache
        uses: actions/cache@v4
        with:
          path: results/_public_demo
          key: public-demo-${{ hashFiles('configs/**/*.yaml', 'scripts/export_public_site.py', 'src/ouroboros/**/*.py', 'geometry/loop_geometry.json') }}
      - name: Export public site
        run: |
          if [ "${{ steps.demo-cache.outputs.cache-hit }}" = "true" ]; then
            python scripts/export_public_site.py --root . --out site --domain ouroboros.beart.cc --skip-run
          else
            python scripts/export_public_site.py --root . --out site --domain ouroboros.beart.cc
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
