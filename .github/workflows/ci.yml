name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: make setup
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Passive demo
        run: |
          make run-scenario SCENARIO=passive
          make visualize RUN=passive
