simulation:
  duration_s: 0.12
  output_interval_s: 0.01
  scenario: multizone-dt
  model: multizone
  integrator:
    method: BDF
    rtol: 1.0e-5
    atol: 1.0e-8
    max_step_s: 2.0e-3
geometry:
  chamber_volume_m3: 1.0
  branch_a_volume_m3: 0.4
  branch_b_volume_m3: 0.4
  return_channel_volume_m3: 0.3
  expansion_volume_m3: 0.2
plasma:
  initial_density_m3: 1.0e18
  initial_ion_temperature_ev: 8000.0
  initial_electron_temperature_ev: 8000.0
  initial_flow_a_m_s: 30.0
  initial_flow_b_m_s: 28.0
  effective_inertia_kg: 1.0e-4
  friction_coeff_kg_s: 1.0e-4
  confinement_time_s: 0.15
throttle_a:
  coupling_mode: consistent
  emf_coeff_v_s_per_m: 5.0e-4
throttle_b:
  coupling_mode: consistent
  emf_coeff_v_s_per_m: 5.0e-4
fusion:
  enabled: true
  reactivity_model: bosch_hale
losses:
  bremsstrahlung: true
  transport: true
  wall: true
  exhaust: true
  magnetic: true
  recovery_fraction: 0.05
  wall_loss_coeff_s: 5.0
  exhaust_loss_coeff_s: 1.0
  anisotropic_transport: true
  tau_parallel_s: 0.03
  tau_perp_s: 0.3
drive:
  external_heater_w: 1.0e5
  drive_force_a_n: 5.0e-3
  drive_force_b_n: 5.0e-3
  fueling_rate_s: 5.0e15
controller:
  type: none
energy:
  relative_tolerance: 1.0e-2
numerics:
  max_nfev: 80000
  max_temperature_ev: 80000.0
multizone:
  geometry_file: geometry/loop_geometry.json
faults: {}
