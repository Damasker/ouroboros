# Milestone 10: energy-consistent reduced MHD + Δp·A pressure drive
simulation:
  duration_s: 0.4
  output_interval_s: 0.01
  scenario: reduced-mhd
  model: lumped
  integrator:
    method: LSODA
    rtol: 1.0e-7
    atol: 1.0e-10
    max_step_s: 2.0e-3
geometry:
  chamber_volume_m3: 1.0
  branch_a_volume_m3: 0.4
  branch_b_volume_m3: 0.4
  return_channel_volume_m3: 0.3
  branch_cross_section_m2: 0.05
plasma:
  initial_density_m3: 1.0e19
  initial_ion_temperature_ev: 200.0
  initial_electron_temperature_ev: 200.0
  initial_flow_a_m_s: 40.0
  initial_flow_b_m_s: 35.0
  effective_inertia_kg: 1.0e-4
  friction_coeff_kg_s: 5.0e-5
throttle_a:
  inductance_h: 2.0e-3
  resistance_ohm: 5.0e-4
  coupling_mode: consistent
  emf_coeff_v_s_per_m: 2.0e-3
  coil_turns_per_metre: 100.0
  initial_current_a: 50.0
throttle_b:
  inductance_h: 2.0e-3
  resistance_ohm: 5.0e-4
  coupling_mode: consistent
  emf_coeff_v_s_per_m: 2.0e-3
  coil_turns_per_metre: 100.0
  initial_current_a: 40.0
fusion:
  enabled: false
losses:
  bremsstrahlung: false
  transport: false
  wall: false
  exhaust: false
  magnetic: true
drive:
  drive_force_a_n: 5.0e-3
  drive_force_b_n: 4.0e-3
controller:
  type: none
energy:
  relative_tolerance: 1.0e-4
reduced_mhd:
  enabled: true
  magnetic_pressure_scale: 1.0e-2
  alfven_damping_fraction: 1.0e-4
  pressure_drive: true
  pressure_drive_scale: 1.0e-6
  compressional_exchange: true
faults: {}
