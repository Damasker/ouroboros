simulation:
  duration_s: 0.4
  output_interval_s: 0.01
  scenario: oned-passive
  model: oned
  integrator:
    method: LSODA
    rtol: 1.0e-6
    atol: 1.0e-9
    max_step_s: 2.0e-3
geometry:
  chamber_volume_m3: 1.0
  branch_a_volume_m3: 0.4
  branch_b_volume_m3: 0.4
  return_channel_volume_m3: 0.3
  expansion_volume_m3: 0.2
  branch_cross_section_m2: 0.05
plasma:
  initial_density_m3: 1.0e19
  initial_ion_temperature_ev: 100.0
  initial_electron_temperature_ev: 100.0
  initial_flow_a_m_s: 80.0
  initial_flow_b_m_s: 72.0
  effective_inertia_kg: 1.0e-4
  friction_coeff_kg_s: 5.0e-4
  confinement_time_s: 0.2
throttle_a:
  inductance_h: 1.0e-3
  resistance_ohm: 1.0e-3
  mutual_inductance_h: 0.0
  initial_current_a: 10.0
  coupling_force_coeff_n_per_a: 0.0
throttle_b:
  inductance_h: 1.0e-3
  resistance_ohm: 1.0e-3
  mutual_inductance_h: 0.0
  initial_current_a: 8.0
  coupling_force_coeff_n_per_a: 0.0
fusion:
  enabled: false
losses:
  bremsstrahlung: false
  transport: false
  wall: false
  exhaust: false
  magnetic: true
drive:
  external_heater_w: 0.0
controller:
  type: none
energy:
  relative_tolerance: 1.0e-3
  absolute_floor_j: 1.0e-6
oned:
  geometry_file: geometry/loop_geometry.json
  cells_per_segment: 4
  export_cells_in_snapshot: true
numerics:
  max_nfev: 100000
faults: {}
