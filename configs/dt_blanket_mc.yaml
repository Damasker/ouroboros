# D–T fusion with Monte Carlo neutron capture (Milestone 20)
simulation:
  duration_s: 0.15
  output_interval_s: 0.005
  scenario: dt-blanket-mc
  integrator:
    method: BDF
    rtol: 1.0e-5
    atol: 1.0e-8
    max_step_s: 2.0e-3
geometry:
  chamber_volume_m3: 1.0
  branch_a_volume_m3: 0.4
  branch_b_volume_m3: 0.4
  return_channel_volume_m3: 0.3
  branch_cross_section_m2: 0.05
plasma:
  initial_density_m3: 1.0e18
  initial_ion_temperature_ev: 8000.0
  initial_electron_temperature_ev: 8000.0
  initial_flow_a_m_s: 30.0
  initial_flow_b_m_s: 28.0
  deuterium_fraction: 0.5
  tritium_fraction: 0.5
  effective_inertia_kg: 1.0e-4
  friction_coeff_kg_s: 1.0e-4
  confinement_time_s: 0.2
  confinement_factor: 1.0
throttle_a:
  inductance_h: 1.0e-3
  resistance_ohm: 1.0e-4
  mutual_inductance_h: 0.0
  coupling_force_coeff_n_per_a: 0.0
throttle_b:
  inductance_h: 1.0e-3
  resistance_ohm: 1.0e-4
  mutual_inductance_h: 0.0
  coupling_force_coeff_n_per_a: 0.0
fusion:
  enabled: true
  reaction: DT
  reactivity_model: bosch_hale
losses:
  bremsstrahlung: true
  transport: true
  wall: true
  exhaust: true
  magnetic: true
  recovery_fraction: 0.05
  wall_loss_coeff_s: 2.0
  exhaust_loss_coeff_s: 0.5
  impurity_z_eff: 1.5
drive:
  external_heater_w: 2.0e5
  drive_force_a_n: 5.0e-3
  drive_force_b_n: 5.0e-3
  fueling_rate_s: 1.0e16
controller:
  type: pid
  parameters:
    setpoint_k: 9.283e7
    kp: 1.0e-2
    ki: 1.0e-4
    kd: 0.0
    power_min_w: 0.0
    power_max_w: 5.0e5
blanket:
  enabled: true
  capture_fraction: 0.9
  coolant_time_s: 0.2
  breeding_ratio: 1.05
  initial_thermal_energy_j: 0.0
  transport: mc
  mc_optical_depth: 2.5
  mc_particles: 128
  mc_seed: 7
energy:
  relative_tolerance: 1.0e-2
numerics:
  max_nfev: 80000
  max_temperature_ev: 50000.0
faults: {}
