simulation:
  duration_s: 0.2
  output_interval_s: 0.005
  scenario: fault-block-a
  integrator:
    method: LSODA
    max_step_s: 2.0e-3
plasma:
  initial_flow_a_m_s: 50.0
  initial_flow_b_m_s: 50.0
throttle_a:
  mutual_inductance_h: 0.0
  coupling_force_coeff_n_per_a: 0.0
throttle_b:
  mutual_inductance_h: 0.0
  coupling_force_coeff_n_per_a: 0.0
fusion:
  enabled: false
losses:
  bremsstrahlung: false
  transport: false
  wall: false
  exhaust: false
  magnetic: true
drive:
  drive_force_a_n: 1.0e-2
  drive_force_b_n: 1.0e-2
faults:
  branch_a_blocked: true
energy:
  relative_tolerance: 1.0e-2
numerics:
  max_nfev: 50000
