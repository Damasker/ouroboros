<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ouroboros Snapshot Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #e8e2d6;
      --bg1: #f3efe6;
      --ink: #1c2420;
      --muted: #5a655e;
      --line: #2a3832;
      --accent: #c45c26;
      --cool: #1f6f6a;
      --panel: rgba(255, 252, 245, 0.92);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(ellipse 80% 50% at 10% 0%, #d9e4df 0%, transparent 55%),
        radial-gradient(ellipse 70% 45% at 90% 100%, #e8d5c4 0%, transparent 50%),
        linear-gradient(165deg, var(--bg1), var(--bg0));
      color: var(--ink);
      font-family: "IBM Plex Mono", ui-monospace, monospace;
    }
    .shell {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.25rem 1.25rem 2rem;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.75rem 1.5rem;
      margin-bottom: 1rem;
    }
    h1 {
      font-family: Syne, sans-serif;
      font-weight: 700;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      letter-spacing: -0.02em;
      margin: 0;
      color: var(--ink);
    }
    .tag {
      color: var(--muted);
      font-size: 0.8rem;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
      background: var(--panel);
      border: 1px solid color-mix(in srgb, var(--line) 18%, transparent);
      padding: 0.85rem 1rem;
      margin-bottom: 1rem;
    }
    @media (min-width: 720px) {
      .controls { grid-template-columns: 2fr 1fr auto auto; align-items: end; }
    }
    label { display: block; font-size: 0.7rem; color: var(--muted); margin-bottom: 0.25rem; text-transform: uppercase; letter-spacing: 0.06em; }
    select, input[type="range"] {
      width: 100%;
      font: inherit;
      color: var(--ink);
      background: #fff;
      border: 1px solid color-mix(in srgb, var(--line) 25%, transparent);
      padding: 0.4rem 0.5rem;
    }
    button {
      font: inherit;
      font-weight: 600;
      border: 1px solid var(--line);
      background: var(--ink);
      color: var(--bg1);
      padding: 0.55rem 1rem;
      cursor: pointer;
    }
    button.secondary { background: transparent; color: var(--ink); }
    button:hover { background: var(--cool); border-color: var(--cool); color: #fff; }
    button.secondary:hover { background: color-mix(in srgb, var(--cool) 15%, transparent); color: var(--ink); }
    .stage {
      position: relative;
      background: #f7f3ea;
      border: 1px solid color-mix(in srgb, var(--line) 20%, transparent);
      overflow: hidden;
    }
    canvas { display: block; width: 100%; height: auto; }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.5rem;
      margin-top: 0.85rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .meta strong { color: var(--ink); font-weight: 600; }
    .err { color: #8b1e1e; margin-top: 0.5rem; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>Ouroboros</h1>
      <span class="tag">snapshot viewer · schema 1.1.0 · <a href="/viewer/webgpu.html" style="color:var(--cool)">WebGPU</a></span>
    </header>
    <div class="controls">
      <div>
        <label for="run">Run</label>
        <select id="run"></select>
      </div>
      <div>
        <label for="field">Field</label>
        <select id="field">
          <option value="density">density</option>
          <option value="temperature">temperature</option>
          <option value="flow_velocity">flow velocity</option>
        </select>
      </div>
      <button id="reload" type="button" class="secondary">Reload</button>
      <button id="play" type="button">Play</button>
    </div>
    <div>
      <label for="frame">Frame <span id="frameLabel">0</span></label>
      <input id="frame" type="range" min="0" max="0" value="0" />
    </div>
    <div class="stage">
      <canvas id="c" width="1000" height="560"></canvas>
    </div>
    <div class="meta">
      <div>t = <strong id="tVal">—</strong> s</div>
      <div>segments = <strong id="nSeg">—</strong></div>
      <div>I<sub>a</sub> = <strong id="ia">—</strong> A</div>
      <div>I<sub>b</sub> = <strong id="ib">—</strong> A</div>
    </div>
    <div class="err" id="err"></div>
  </div>
  <script>
    const API = "";
    const $ = (id) => document.getElementById(id);
    const state = { frames: [], geom: null, playing: false, raf: 0, lastTs: 0 };

    const LAYOUT = {
      branch_a: [[0.18, 0.28], [0.42, 0.18], [0.62, 0.22], [0.78, 0.35]],
      reaction_chamber: [[0.78, 0.35], [0.84, 0.50], [0.78, 0.65]],
      branch_b: [[0.78, 0.65], [0.62, 0.78], [0.42, 0.82], [0.18, 0.72]],
      return_channel: [[0.18, 0.72], [0.12, 0.50], [0.18, 0.28]],
      expansion_nozzle: [[0.84, 0.50], [0.94, 0.50]],
      throttle_a: [[0.42, 0.18], [0.50, 0.16]],
      throttle_b: [[0.42, 0.82], [0.50, 0.84]],
    };

    function lerp(a, b, t) { return a + (b - a) * t; }
    function hexLerp(c0, c1, t) {
      const p = (c) => [parseInt(c.slice(1,3),16), parseInt(c.slice(3,5),16), parseInt(c.slice(5,7),16)];
      const [r0,g0,b0] = p(c0), [r1,g1,b1] = p(c1);
      const r = Math.round(lerp(r0,r1,t)), g = Math.round(lerp(g0,g1,t)), b = Math.round(lerp(b0,b1,t));
      return `rgb(${r},${g},${b})`;
    }
    function colorMap(t) {
      t = Math.min(1, Math.max(0, t));
      if (t < 0.5) return hexLerp("#1f6f6a", "#d8c39a", t * 2);
      return hexLerp("#d8c39a", "#c45c26", (t - 0.5) * 2);
    }

    async function fetchJSON(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`${url} → ${r.status}`);
      return r.json();
    }

    async function loadRuns() {
      const data = await fetchJSON(`${API}/runs`);
      const sel = $("run");
      sel.innerHTML = "";
      for (const run of data.runs || []) {
        const opt = document.createElement("option");
        opt.value = run.run_id;
        opt.textContent = `${run.run_id} (${run.n_snapshots ?? "?"} frames)`;
        sel.appendChild(opt);
      }
      if (!data.runs?.length) {
        $("err").textContent = "No runs with snapshots in results/. Run a scenario first.";
      }
    }

    async function loadGeometry() {
      try {
        state.geom = await fetchJSON(`${API}/geometry`);
      } catch {
        state.geom = null;
      }
    }

    async function loadRun(runId) {
      $("err").textContent = "";
      const data = await fetchJSON(`${API}/runs/${encodeURIComponent(runId)}/snapshots`);
      state.frames = data.frames || [];
      $("frame").max = Math.max(0, state.frames.length - 1);
      $("frame").value = 0;
      draw(0);
    }

    function segmentMap(frame) {
      const m = {};
      for (const s of frame.segments || []) m[s.id] = s;
      return m;
    }

    function fieldRange(frames, field) {
      let lo = Infinity, hi = -Infinity;
      for (const f of frames) {
        for (const s of f.segments || []) {
          const v = Number(s[field]);
          if (!Number.isFinite(v)) continue;
          lo = Math.min(lo, v); hi = Math.max(hi, v);
        }
      }
      if (!Number.isFinite(lo)) return [0, 1];
      if (hi <= lo) hi = lo + 1;
      return [lo, hi];
    }

    function drawPolyline(ctx, pts, w, h, color, width) {
      if (pts.length < 2) return;
      ctx.beginPath();
      ctx.moveTo(pts[0][0] * w, pts[0][1] * h);
      for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0] * w, pts[i][1] * h);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.stroke();
    }

    function draw(idx) {
      const canvas = $("c");
      const ctx = canvas.getContext("2d");
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      // subtle grid
      ctx.strokeStyle = "rgba(42,56,50,0.08)";
      ctx.lineWidth = 1;
      for (let x = 40; x < w; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
      for (let y = 40; y < h; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }

      const frame = state.frames[idx];
      $("frameLabel").textContent = String(idx);
      if (!frame) {
        $("tVal").textContent = "—";
        return;
      }
      const field = $("field").value;
      const [lo, hi] = fieldRange(state.frames, field);
      const segs = segmentMap(frame);

      // underlay paths
      for (const [id, pts] of Object.entries(LAYOUT)) {
        drawPolyline(ctx, pts, w, h, "rgba(28,36,32,0.12)", 18);
      }
      for (const [id, pts] of Object.entries(LAYOUT)) {
        const s = segs[id];
        let col = "rgba(28,36,32,0.35)";
        if (s && Number.isFinite(Number(s[field]))) {
          const t = (Number(s[field]) - lo) / (hi - lo);
          col = colorMap(t);
        }
        drawPolyline(ctx, pts, w, h, col, id.includes("throttle") ? 10 : 14);
      }

      // labels
      ctx.fillStyle = "#1c2420";
      ctx.font = "600 13px IBM Plex Mono";
      const labels = [
        ["branch_a", 0.40, 0.12],
        ["branch_b", 0.40, 0.90],
        ["chamber", 0.80, 0.48],
        ["return", 0.05, 0.48],
      ];
      for (const [txt, x, y] of labels) ctx.fillText(txt, x * w, y * h);

      const comps = Object.fromEntries((frame.components || []).map(c => [c.id, c]));
      $("tVal").textContent = Number(frame.time).toFixed(4);
      $("nSeg").textContent = String((frame.segments || []).length);
      $("ia").textContent = comps.throttle_a ? Number(comps.throttle_a.current).toFixed(3) : "—";
      $("ib").textContent = comps.throttle_b ? Number(comps.throttle_b.current).toFixed(3) : "—";
    }

    function tick(ts) {
      if (!state.playing) return;
      if (ts - state.lastTs > 80) {
        state.lastTs = ts;
        let i = Number($("frame").value) + 1;
        if (i >= state.frames.length) i = 0;
        $("frame").value = i;
        draw(i);
      }
      state.raf = requestAnimationFrame(tick);
    }

    $("play").onclick = () => {
      state.playing = !state.playing;
      $("play").textContent = state.playing ? "Pause" : "Play";
      if (state.playing) state.raf = requestAnimationFrame(tick);
      else cancelAnimationFrame(state.raf);
    };
    $("frame").oninput = () => draw(Number($("frame").value));
    $("field").onchange = () => draw(Number($("frame").value));
    $("run").onchange = () => loadRun($("run").value);
    $("reload").onclick = async () => {
      await loadRuns();
      if ($("run").value) await loadRun($("run").value);
    };

    (async () => {
      try {
        await loadGeometry();
        await loadRuns();
        if ($("run").value) await loadRun($("run").value);
      } catch (e) {
        $("err").textContent = String(e.message || e);
      }
    })();
  </script>
</body>
</html>
